{% extends "base.html" %}

{% block title %}Arbeitsscheine Verwaltung{% endblock %}

{% block extra_css %}
<style>
    /* Fenster "Neuer Schein" auf der Startseite */
    .ae-dialog-nummer {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: .02em;
        line-height: 1.2;
    }
    .ae-dialog-tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 20px 0;
    }
    .ae-dialog-tile {
        padding: 12px;
        border-radius: 12px;
        background: var(--bs-tertiary-bg);
        border: 1px solid var(--bs-border-color);
    }
    .ae-dialog-tile .label {
        font-size: .85rem;
        color: var(--bs-secondary-color);
    }
    .ae-dialog-tile .value {
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.2;
    }
    #ausgebenModal .modal-footer {
        flex-wrap: nowrap;
        gap: 12px;
    }
    #ausgebenModal .modal-footer .btn {
        flex: 1 1 0;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">

    <!-- Suchleiste -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="input-group input-group-lg">
                <input type="text" id="ae_nummer" class="form-control"
                       placeholder="AE-Nummer eingeben..."
                       inputmode="numeric" autocomplete="off" maxlength="8" autofocus
                       oninput="limitInput(this); filterListe()"
                       onkeydown="handleAeNummerKeydown(event)">
                <button class="btn btn-primary" onclick="showAusgebenModal()">
                    <img src="/static/plus.svg" height="24" style="filter: brightness(0) invert(1);"> Neuer Schein
                </button>
            </div>
        </div>
    </div>

    <h5 class="text-center mb-4 text-muted" id="listeHeader">Aktuell ausgegebene AE</h5>

    <!-- Liste -->
    <div id="scheineListe" class="list-group"></div>

</div>

<!-- Ausgeben Modal -->
<div class="modal" id="ausgebenModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ausgebenTitle">Neuen Schein anlegen?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="ausgebenBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">Abbrechen</button>
                <button type="button" id="confirmAusgeben" class="btn btn-primary btn-lg">Anlegen</button>
            </div>
        </div>
    </div>
</div>

<!-- Status Modal -->
<div class="modal" id="statusModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Status ändern</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="statusModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button type="button" id="confirmStatus" class="btn btn-primary">Bestätigen</button>
            </div>
        </div>
    </div>
</div>

<!-- Mappe nach der Statusänderung -->
<div class="modal" id="mappeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Mappe</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="mappeModalBody"></div>
            <div class="modal-footer">
                <button type="button" id="mappeOk" class="btn btn-primary btn-lg w-100" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<!-- Löschen Modal -->
<div class="modal" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Schein löschen?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="deleteModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button type="button" id="confirmDelete" class="btn btn-danger">Löschen</button>
            </div>
        </div>
    </div>
</div>

<script>
// Uniper Farben
const uniperColors = ['#0476D9', '#5f2176', '#ee7203', '#00733f', '#002d5a', '#8c2a8c'];

let allScheine = [];

function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function loadAllScheine() {
    return fetch('/scheine')
        .then(res => res.json())
        .then(data => {
            allScheine = data;
            filterListe();
        });
}

function groupByAe(scheine) {
    const groups = [];
    const byAe = {};
    scheine.forEach(s => {
        const key = String(s.ae_nummer);
        if (!byAe[key]) {
            byAe[key] = [];
            groups.push(byAe[key]);
        }
        byAe[key].push(s);
    });
    groups.forEach(g => g.sort((a, b) => a.vorgang - b.vorgang));
    return groups;
}

function isActive(s) {
    return s.status === 'ausgegeben' || s.status === 'in arbeit';
}

function detailsHtml(s) {
    return `
        <div class="small">
            <strong>Firma:</strong> ${escapeHtml(s.firma) || '-'} &nbsp;&nbsp;
            <strong>Ort:</strong> ${escapeHtml(s.ort) || '-'} &nbsp;&nbsp;
            <strong>Mitarbeiter:</strong> ${s.personen} &nbsp;&nbsp;
            <strong>Telefon:</strong> ${escapeHtml(s.telefonnummer) || '-'}
        </div>
        ${s.bemerkung ? `<div class="mt-1 text-danger small"><strong>Bemerkung:</strong> ${escapeHtml(s.bemerkung)}</div>` : ''}`;
}

function buttonsHtml(s) {
    return `
        ${isActive(s)
            ? `<button data-action="status" data-newstatus="zurueckgegeben" class="btn btn-sm btn-outline-warning">
                <span class="btn-icon" style="--icon: url(/static/pause.svg)" aria-hidden="true"></span> Unterbrechung
               </button>`
            : `<button data-action="status" data-newstatus="in arbeit" class="btn btn-sm btn-outline-success">
                <span class="btn-icon" style="--icon: url(/static/helm.svg)" aria-hidden="true"></span> In Arbeit
               </button>`
        }
        <button data-action="edit" class="btn btn-sm btn-outline-primary">
            <span class="btn-icon" style="--icon: url(/static/stift.svg)" aria-hidden="true"></span> Bearbeiten
        </button>
        <button data-action="delete" class="btn btn-sm btn-outline-danger">
            <span class="btn-icon" style="--icon: url(/static/muell.svg)" aria-hidden="true"></span> Löschen
        </button>`;
}

function renderEinzelKarte(s, color) {
    return `
    <div class="list-group-item list-group-item-action p-0 mb-2 border rounded" data-id="${s.id}">
        <div style="background-color: ${color}; color: white; border-radius: 6px 6px 0 0;" class="px-3 py-2">
            <strong>AE ${escapeHtml(s.ae_nummer)}</strong> &nbsp;&nbsp;
            <span>Vorgang ${s.vorgang}</span> &nbsp;&nbsp;
            <span>Mappe ${s.fach}</span>
        </div>
        <div class="px-3 py-2">${detailsHtml(s)}</div>
        <div class="px-3 pb-2 d-flex justify-content-end gap-2">${buttonsHtml(s)}</div>
    </div>`;
}

function renderGruppenKarte(group, color) {
    const first = group[0];
    const rows = group.map(s => `
        <div class="tree-row" data-id="${s.id}">
            <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                    <div class="fw-bold">
                        Vorgang ${s.vorgang}
                        ${isActive(s) ? '' : '<span class="badge bg-secondary ms-1">unterbrochen</span>'}
                    </div>
                    ${detailsHtml(s)}
                </div>
                <div class="d-flex gap-2 flex-shrink-0">${buttonsHtml(s)}</div>
            </div>
        </div>`).join('');
    return `
    <div class="list-group-item p-0 mb-2 border rounded">
        <div style="background-color: ${color}; color: white; border-radius: 6px 6px 0 0;"
             class="px-3 py-2 d-flex justify-content-between">
            <span><strong>AE ${escapeHtml(first.ae_nummer)}</strong> &nbsp;&nbsp; <span>Mappe ${first.fach}</span></span>
            <span>${group.length} Vorgänge</span>
        </div>
        <div class="pb-1">${rows}</div>
    </div>`;
}

function renderScheineListe(filteredScheine) {
    const container = document.getElementById('scheineListe');
    container.innerHTML = '';

    if (filteredScheine.length === 0) {
        container.innerHTML = `
            <div class="list-group-item text-center py-5">
                <img src="/static/lupe.png" alt="Keine Ergebnisse" 
                     style="width: 90px; opacity: 0.7; margin-bottom: 20px;">
                <p class="text-muted fs-5 mb-1">Kein Arbeitsschein gefunden</p>
            </div>
        `;
        return;
    }

    // Vorgänge einer AE-Nummer als eine Karte (Baum), einzelne wie bisher.
    const html = groupByAe(filteredScheine).map((group, index) => {
        const color = uniperColors[index % uniperColors.length];
        return group.length === 1 ? renderEinzelKarte(group[0], color) : renderGruppenKarte(group, color);
    }).join('');

    container.innerHTML = html;
}

document.getElementById('scheineListe').addEventListener('click', function(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const item = btn.closest('[data-id]');
    const id = parseInt(item.dataset.id, 10);
    const schein = allScheine.find(s => s.id === id);
    if (!schein) return;

    if (btn.dataset.action === 'status') {
        showStatusModal(id, btn.dataset.newstatus, schein.ae_nummer, schein.vorgang, schein.fach);
    } else if (btn.dataset.action === 'edit') {
        location.href = `/edit/${id}`;
    } else if (btn.dataset.action === 'delete') {
        showDeleteModal(id, schein.ae_nummer, schein.vorgang);
    }
});

function filterListe() {
    const searchValue = document.getElementById('ae_nummer').value.trim().toLowerCase();

    let filtered = allScheine;

    if (searchValue) {
        filtered = allScheine.filter(s =>
            String(s.ae_nummer == null ? '' : s.ae_nummer).toLowerCase().includes(searchValue)
        );
        document.getElementById('listeHeader').textContent = `Suchergebnisse für "${searchValue}" (${filtered.length})`;
    } else {
        filtered = allScheine.filter(s => 
            s.status === 'ausgegeben' || s.status === 'in arbeit'
        );
        document.getElementById('listeHeader').textContent = "Aktuell ausgegebene AE";
    }

    renderScheineListe(filtered);
}

function handleAeNummerKeydown(event) {
    if (event.key !== 'Enter') return;
    if (document.querySelector('.modal.show')) return;
    // stopPropagation verhindert, dass dasselbe Enter-Event sofort auch den
    // globalen Bestaetigen-Handler in base.html ausloest und das gerade erst
    // geoeffnete Modal ungewollt sofort wieder bestaetigt.

    // Scanner-Shortcut: AE-Nummer mit genau einem Vorgang -> gleich das
    // Status-Fenster. Scannen, Enter, Enter, fertig. Bei mehreren Vorgaengen
    // entscheidet man per Antippen in der Liste.
    const ae = document.getElementById('ae_nummer').value.trim();
    const exakt = allScheine.filter(s => String(s.ae_nummer) === ae);
    if (ae && exakt.length === 1) {
        const s = exakt[0];
        event.stopPropagation();
        showStatusModal(s.id, isActive(s) ? 'zurueckgegeben' : 'in arbeit', s.ae_nummer, s.vorgang, s.fach);
        return;
    }

    const hasResults = document.querySelector('#scheineListe [data-id]') !== null;
    if (!hasResults) {
        event.stopPropagation();
        showAusgebenModal();
    }
}

function refocusAeNummerField() {
    if (document.querySelector('.modal.show')) return;
    document.getElementById('ae_nummer').focus();
}

function showStatusModal(id, newStatus, aeNummer, vorgang, fach) {
    const actionText = newStatus === 'zurueckgegeben' ? 'Unterbrechung' : 'In Arbeit';
    
    document.getElementById('statusModalBody').innerHTML = `
        <p>Schein <strong>AE ${escapeHtml(aeNummer)} (Vorgang ${vorgang})</strong></p>
        <p>Status wirklich auf <strong>${actionText}</strong> setzen?</p>
    `;
    
    const modal = new bootstrap.Modal(document.getElementById('statusModal'));
    modal.show();

    document.getElementById('confirmStatus').onclick = function() {
        const btn = this;
        btn.disabled = true;
        fetch(`/status/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: newStatus})
        }).then(res => {
            if (!res.ok) throw new Error('Status konnte nicht geändert werden');
            window.aeShowMappeAfterClose = {
                aeNummer: aeNummer,
                vorgang: vorgang,
                fach: fach,
                // In Arbeit: Schein wird aus der Mappe geholt. Unterbrechung: kommt zurück hinein.
                text: newStatus === 'in arbeit' ? 'Der Schein ist in' : 'Der Schein gehört in'
            };
            modal.hide();
            loadAllScheine();
            document.getElementById('ae_nummer').value = '';
        }).catch(err => {
            alert(err.message);
        }).finally(() => {
            btn.disabled = false;
        });
    };
}

function showMappeModal(info) {
    document.getElementById('mappeModalBody').innerHTML = `
        <p>AE <strong>${escapeHtml(info.aeNummer)}</strong>, Vorgang ${escapeHtml(info.vorgang)}</p>
        <p class="text-muted mb-1">${escapeHtml(info.text || 'Der Schein gehört in')}</p>
        <div class="fs-4">Mappe</div>
        <div class="mappe-number">${escapeHtml(info.fach)}</div>
    `;
    new bootstrap.Modal(document.getElementById('mappeModal')).show();
}

function showDeleteModal(id, aeNummer, vorgang) {
    document.getElementById('deleteModalBody').innerHTML = `
        <p>Möchten Sie den Schein <strong>AE ${escapeHtml(aeNummer)} (Vorgang ${vorgang})</strong> wirklich löschen?</p>
        <p class="text-danger">Diese Aktion kann nicht rückgängig gemacht werden.</p>
    `;
    const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
    modal.show();

    document.getElementById('confirmDelete').onclick = function() {
        fetch(`/delete/${id}`, { method: 'DELETE' })
            .then(res => {
                if (!res.ok) throw new Error('Löschen fehlgeschlagen');
                modal.hide();
                loadAllScheine();
                document.getElementById('ae_nummer').value = '';
                window.aeOfferUndo(id, `AE ${aeNummer} (Vorgang ${vorgang}) gelöscht`, loadAllScheine);
            })
            .catch(err => alert('Fehler beim Löschen: ' + err.message));
    };
}

function showAusgebenModal() {
    const ae = document.getElementById('ae_nummer').value.trim();
    if (!ae) {
        window.location.href = '/eingabe';
        return;
    }

    // Gibt es die AE schon, wird ein weiterer Vorgang in derselben Mappe angelegt.
    const vorhanden = allScheine.filter(s => String(s.ae_nummer) === ae);
    const title = document.getElementById('ausgebenTitle');
    const body = document.getElementById('ausgebenBody');
    const confirmBtn = document.getElementById('confirmAusgeben');
    if (vorhanden.length) {
        const vorgaenge = vorhanden.map(s => s.vorgang).sort((a, b) => a - b).join(', ');
        title.textContent = 'AE existiert bereits';
        body.innerHTML = `
            <div class="ae-dialog-nummer">AE ${escapeHtml(ae)}</div>
            <div class="ae-dialog-tiles">
                <div class="ae-dialog-tile">
                    <div class="label">Mappe</div>
                    <div class="value">${escapeHtml(vorhanden[0].fach)}</div>
                </div>
                <div class="ae-dialog-tile">
                    <div class="label">${vorhanden.length === 1 ? 'Vorgang' : 'Vorgänge'}</div>
                    <div class="value">${escapeHtml(vorgaenge)}</div>
                </div>
            </div>
            <p class="fs-5 mb-0">Weiteren Vorgang in dieser Mappe anlegen?</p>
        `;
        confirmBtn.textContent = 'Vorgang anlegen';
    } else {
        title.textContent = 'Neuer Schein';
        body.innerHTML = `
            <div class="ae-dialog-nummer">AE ${escapeHtml(ae)}</div>
            <p class="text-body-secondary mt-2 mb-3">Diese AE-Nummer gibt es noch nicht.</p>
            <p class="fs-5 mb-0">Neuen Schein anlegen?</p>
        `;
        confirmBtn.textContent = 'Anlegen';
    }

    const modal = new bootstrap.Modal(document.getElementById('ausgebenModal'));
    modal.show();

    document.getElementById('confirmAusgeben').onclick = function() {
        modal.hide();
        window.location.href = `/eingabe?ae_nummer=${encodeURIComponent(ae)}`;
    };
}

function limitInput(input) {
    const value = input.value.replace(/[^0-9]/g, '').slice(0, 8);
    if (input.value !== value) input.value = value;
}

window.onload = function() {
    // Nach "Neuer Schein" kommt /?neu=<id>: dann die Mappe anzeigen.
    // Parameter gleich entfernen, damit Neuladen das Fenster nicht erneut zeigt.
    const neuId = parseInt(new URLSearchParams(location.search).get('neu'), 10);
    if (neuId) history.replaceState(null, '', '/');

    loadAllScheine().then(() => {
        const schein = neuId ? allScheine.find(s => s.id === neuId) : null;
        if (schein) {
            showMappeModal({ aeNummer: schein.ae_nummer, vorgang: schein.vorgang, fach: schein.fach });
        }
    });
    document.getElementById('ae_nummer').focus();
};

// Suchfeld soll immer aktiv/fokussiert bleiben, damit direkt (weiter-)getippt
// werden kann - ausser waehrend ein Modal offen ist.
document.getElementById('ae_nummer').addEventListener('blur', function() {
    setTimeout(refocusAeNummerField, 50);
});

['ausgebenModal', 'deleteModal', 'mappeModal'].forEach(function(modalId) {
    document.getElementById(modalId).addEventListener('hidden.bs.modal', refocusAeNummerField);
});
document.getElementById('statusModal').addEventListener('hidden.bs.modal', function() {
    if (window.aeShowMappeAfterClose) {
        const info = window.aeShowMappeAfterClose;
        window.aeShowMappeAfterClose = null;
        showMappeModal(info);
        return;
    }
    refocusAeNummerField();
});
</script>
{% endblock %}
