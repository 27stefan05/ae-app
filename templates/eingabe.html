{% extends "base.html" %}

{% block title %}Neuer Arbeitsschein{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">

    <h4 class="mb-4">Neuer Arbeitsschein</h4>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/eingabe">
        <div class="row g-3">

            <!-- AE-Nummer -->
            <div class="col-md-6">
                <label class="form-label">AE-Nummer</label>
                <input type="text" name="ae_nummer" id="aeNummerInput" class="form-control form-control-lg" 
                       value="{{ values.ae_nummer }}" maxlength="8" required>
                <div id="aeHint" class="form-text text-warning-emphasis d-none"></div>
            </div>

            <!-- Vorgang -->
            <div class="col-md-3">
                <label class="form-label">Vorgang</label>
                <select name="vorgang" id="vorgangSelect" class="form-select form-select-lg" required>
                    {% for v in vorgang_options %}
                    <option value="{{ v }}" {% if values.vorgang|string == v|string %}selected{% endif %}>{{ v }}</option>
                    {% endfor %}
                    <option value="__custom__">Andere Zahl…</option>
                </select>
                <input type="number" id="vorgangCustom" class="form-control form-control-lg mt-2"
                       placeholder="Vorgangsnummer eingeben" min="10" style="display:none">
            </div>

            <!-- Mappe -->
            <div class="col-md-3">
                <label class="form-label">Mappe</label>
                <input type="number" name="fach" id="fachInput" class="form-control form-control-lg" 
                       value="{{ next_fach or '' }}" data-free-fach="{{ free_fach or '' }}" readonly>
            </div>

            <!-- Firma -->
            <div class="col-md-6">
                <label class="form-label">Firma</label>
                <div class="input-group">
                    <select name="firma" class="form-select" id="firmaSelect">
                        <option value="">-- Firma auswählen --</option>
                        {% for firma in firmen %}
                        <option value="{{ firma.name }}" 
                            {% if values.firma == firma.name %}selected{% endif %}>
                            {{ firma.name }}
                        </option>
                        {% endfor %}
                    </select>
                    <button type="button" class="btn btn-outline-primary" onclick="showNewFirmaModal()">Neu</button>
                </div>
            </div>

            <!-- Ort -->
            <div class="col-md-6">
                <label class="form-label">Ort</label>
                <div class="input-group">
                    <select name="ort" class="form-select" id="ortSelect">
                        <option value="">-- Ort auswählen --</option>
                        {% for ort in orte %}
                        <option value="{{ ort.name }}" 
                            {% if values.ort == ort.name %}selected{% endif %}>
                            {{ ort.name }}
                        </option>
                        {% endfor %}
                    </select>
                    <button type="button" class="btn btn-outline-primary" onclick="showNewOrtModal()">Neu</button>
                </div>
            </div>

            <!-- Anzahl Mitarbeiter -->
            <div class="col-md-6">
                <label class="form-label">Anzahl Mitarbeiter</label>
                <input type="number" name="personen" class="form-control" min="1" 
                       value="{{ values.personen }}">
            </div>

            <!-- Telefonnummer -->
            <div class="col-md-6">
                <label class="form-label">Telefonnummer</label>
                <input type="text" name="telefonnummer" class="form-control" 
                       value="{{ values.telefonnummer }}">
            </div>

            <!-- Bemerkung -->
            <div class="col-12">
                <label class="form-label">Bemerkung</label>
                <textarea name="bemerkung" class="form-control" rows="3">{{ values.bemerkung }}</textarea>
            </div>
        </div>

        <div class="mt-4 d-flex gap-3">
            <button type="submit" class="btn btn-primary btn-lg">Speichern</button>
            <a href="/" class="btn btn-outline-secondary btn-lg">Abbrechen</a>
        </div>
    </form>
</div>

<!-- Neue Firma Modal -->
<div class="modal" id="newFirmaModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Neue Firma anlegen</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newFirmaName" class="form-control" placeholder="Firmenname">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button type="button" class="btn btn-primary" onclick="addNewFirma()">Anlegen & auswählen</button>
            </div>
        </div>
    </div>
</div>

<!-- Neuer Ort Modal -->
<div class="modal" id="newOrtModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Neuen Ort anlegen</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newOrtName" class="form-control" placeholder="Ortsname">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <button type="button" class="btn btn-primary" onclick="addNewOrt()">Anlegen & auswählen</button>
            </div>
        </div>
    </div>
</div>

<script>
function showNewFirmaModal() {
    document.getElementById('newFirmaName').value = '';
    new bootstrap.Modal(document.getElementById('newFirmaModal')).show();
}

function showNewOrtModal() {
    document.getElementById('newOrtName').value = '';
    new bootstrap.Modal(document.getElementById('newOrtModal')).show();
}

function currentFormParams() {
    const params = new URLSearchParams();
    document.querySelectorAll('form[action="/eingabe"] [name]').forEach(function(el) {
        if (el.name) params.set(el.name, el.value);
    });
    return params;
}

function addNewFirma() {
    const name = document.getElementById('newFirmaName').value.trim();
    if (!name) return alert('Bitte Firmennamen eingeben');

    const params = currentFormParams();
    params.delete('firma');
    params.set('preselect_firma', name);
    window.location.href = '/eingabe?' + params.toString();
}

function addNewOrt() {
    const name = document.getElementById('newOrtName').value.trim();
    if (!name) return alert('Bitte Ortsnamen eingeben');

    const params = currentFormParams();
    params.delete('ort');
    params.set('preselect_ort', name);
    window.location.href = '/eingabe?' + params.toString();
}

// Automatische Auswahl nach Redirect
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);

    const preselectFirma = urlParams.get('preselect_firma');
    if (preselectFirma) {
        const select = document.getElementById('firmaSelect');
        if (select) select.value = preselectFirma;
    }

    const preselectOrt = urlParams.get('preselect_ort');
    if (preselectOrt) {
        const select = document.getElementById('ortSelect');
        if (select) select.value = preselectOrt;
    }
});

// Vorgang: Dropdown mit Ausweichfeld fuer Ausnahmen (z.B. Vorgang 11)
const vorgangSelect = document.getElementById('vorgangSelect');
const vorgangCustom = document.getElementById('vorgangCustom');

function syncVorgangField() {
    if (vorgangSelect.value === '__custom__') {
        vorgangCustom.style.display = 'block';
        vorgangCustom.required = true;
        vorgangCustom.name = 'vorgang';
        vorgangSelect.removeAttribute('name');
    } else {
        vorgangCustom.style.display = 'none';
        vorgangCustom.required = false;
        vorgangCustom.removeAttribute('name');
        vorgangSelect.name = 'vorgang';
    }
}
vorgangSelect.addEventListener('change', syncVorgangField);

// Gleiche AE-Nummer kommt in dieselbe Mappe. Beim Tippen Mappe, Hinweis und
// Vorgang anpassen. Der Server entscheidet beim Speichern trotzdem selbst.
const aeInput = document.getElementById('aeNummerInput');
const fachInput = document.getElementById('fachInput');
const aeHint = document.getElementById('aeHint');
let scheineByAe = {};

function selectVorgang(value) {
    const text = String(value);
    if ([...vorgangSelect.options].some(o => o.value === text)) {
        vorgangSelect.value = text;
    } else {
        vorgangSelect.value = '__custom__';
        vorgangCustom.value = text;
    }
    syncVorgangField();
}

function currentVorgang() {
    return vorgangSelect.value === '__custom__' ? vorgangCustom.value : vorgangSelect.value;
}

function updateForAe(adjustVorgang) {
    const info = scheineByAe[aeInput.value.trim()];
    if (!info) {
        fachInput.value = fachInput.dataset.freeFach;
        aeHint.classList.add('d-none');
        return;
    }
    fachInput.value = info.fach;
    const vorgaenge = [...info.vorgaenge].sort((a, b) => a - b);
    aeHint.textContent = `AE existiert bereits in Mappe ${info.fach} (Vorgang ${vorgaenge.join(', ')}). ` +
        'Ein weiterer Vorgang kommt in dieselbe Mappe.';
    aeHint.classList.remove('d-none');
    if (adjustVorgang && info.vorgaenge.has(Number(currentVorgang()))) {
        let next = 10;
        while (info.vorgaenge.has(next)) next += 10;
        selectVorgang(next);
    }
}

aeInput.addEventListener('input', function() { updateForAe(true); });

fetch('/scheine')
    .then(res => res.json())
    .then(data => {
        scheineByAe = {};
        data.forEach(s => {
            const entry = scheineByAe[s.ae_nummer] || (scheineByAe[s.ae_nummer] = { fach: s.fach, vorgaenge: new Set() });
            entry.vorgaenge.add(s.vorgang);
        });
        updateForAe(false);
    })
    .catch(() => {});

document.addEventListener('DOMContentLoaded', function() {
    const preset = {{ values.vorgang|tojson }};
    if (preset && ![...vorgangSelect.options].some(o => o.value === String(preset))) {
        vorgangSelect.value = '__custom__';
        vorgangCustom.value = preset;
    }
    syncVorgangField();
});
</script>
{% endblock %}
